<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Território Inventivo — Pequena África | Páginas de leitura</title>
  <meta name="description" content="Páginas de leitura acessíveis do Território Inventivo — Pequena África / MUHCAB." />
  <style>
    :root{
      --paper:#FCFBF8;
      --ink:#221F1C;
      --muted:#5C574F;
      --orange:#E55000;
      --teal:#229B8A;
      --teal-dark:#137E70;
      --rule:rgba(34,31,28,.13);
      --card:#FFFFFF;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
      font-size:19px;
      line-height:1.6;
    }
    .wrap{max-width:760px;margin:0 auto;padding:40px 22px 64px}
    header{text-align:center;padding-bottom:28px;border-bottom:2px solid var(--rule)}
    .logo{max-width:260px;width:60%;height:auto;display:block;margin:0 auto 22px}
    h1{
      color:var(--orange);
      font-size:clamp(1.7rem,5vw,2.4rem);
      line-height:1.2;
      margin:0 0 .35em;
      letter-spacing:-.01em;
    }
    .tagline{color:var(--muted);margin:0;font-size:1rem}
    h2{
      color:var(--teal);
      font-size:1.15rem;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin:38px 0 14px;
    }
    ul.textos{list-style:none;margin:0;padding:0}
    ul.textos li{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:14px;
      margin:0 0 14px;
      background:var(--card);
      border:1px solid var(--rule);
      border-left:6px solid var(--teal);
      border-radius:8px;
      padding:14px 18px;
      transition:border-color .15s ease;
    }
    ul.textos li:hover,
    ul.textos li:focus-within{
      border-left-color:var(--orange);
    }
    ul.textos .link{
      flex:1 1 200px;
      display:block;
      color:var(--teal-dark);
      font-weight:600;
      text-decoration:none;
      transition:color .15s ease, transform .15s ease;
    }
    ul.textos li:hover .link,
    ul.textos .link:focus-visible{
      color:var(--orange);
      transform:translateX(2px);
    }
    ul.textos .num{
      display:block;
      font-size:.78rem;
      font-weight:600;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:2px;
    }
    ul.textos .qr{
      flex:0 0 auto;
      display:block;
      line-height:0;
    }
    ul.textos .qr img{
      display:block;
      width:136px;
      height:136px;
      border-radius:6px;
      border:1px solid var(--rule);
      background:#fff;
    }
    a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
    @media (max-width:480px){
      ul.textos li{
        flex-direction:column;
        align-items:stretch;
        text-align:center;
      }
      ul.textos .link{
        text-align:left;
      }
      ul.textos .qr{
        align-self:center;
      }
      ul.textos .qr img{
        width:168px;
        height:168px;
      }
    }
    footer{
      margin-top:44px;
      padding-top:20px;
      border-top:2px solid var(--rule);
      color:var(--muted);
      font-size:.88rem;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="logo_territorio_inventivo.png"
           alt="Território Inventivo — Pequena África" />
      <h1>Território Inventivo — Pequena África</h1>
      <p class="tagline">Páginas de leitura acessíveis · MUHCAB</p>
    </header>

    <main>
      <h2>Textos</h2>
      <ul class="textos">
        <li>
          <a class="link" href="texto-01-linha-do-tempo.html">
            <span class="num">Texto 01</span>Linha do Tempo do MUHCAB
          </a>
          <span class="qr">
            <img src="qrcodes/qr-texto-01-linha-do-tempo.png"
                 alt="QR Code de acesso à página Linha do Tempo do MUHCAB"
                 loading="lazy" width="136" height="136" />
          </span>
        </li>
        <li>
          <a class="link" href="texto-02-mapa-da-diaspora.html">
            <span class="num">Texto 02</span>Mapa Digital da Diáspora
          </a>
          <span class="qr">
            <img src="qrcodes/qr-texto-02-mapa-da-diaspora.png"
                 alt="QR Code de acesso à página Mapa Digital da Diáspora"
                 loading="lazy" width="136" height="136" />
          </span>
        </li>
        <li>
          <a class="link" href="texto-03-encruzilhada.html">
            <span class="num">Texto 03</span>Sala Encruzilhada
          </a>
          <span class="qr">
            <img src="qrcodes/qr-texto-03-encruzilhada.png"
                 alt="QR Code de acesso à página Sala Encruzilhada"
                 loading="lazy" width="136" height="136" />
          </span>
        </li>
        <li>
          <a class="link" href="texto-04-verbetes-maquetes.html">
            <span class="num">Texto 04</span>Verbetes das Maquetes
          </a>
          <span class="qr">
            <img src="qrcodes/qr-texto-04-verbetes-maquetes.png"
                 alt="QR Code de acesso à página Verbetes das Maquetes"
                 loading="lazy" width="136" height="136" />
          </span>
        </li>
      </ul>
    </main>

    <footer>
      Território Inventivo — Pequena África · MUHCAB
    </footer>
  </div>
</body>
</html>
